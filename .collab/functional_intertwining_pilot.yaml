study_id: functional-intertwining-action-constraints-r011
claim: "A descriptor-and-cycle-estimated Functional Map transports finite-horizon action equations so that unsatisfied transferable equations can be learned by a receiver, while already-satisfied, wrong-map, shuffled, and task-harmful equations do not produce effective flow."
stage: design
code:
  project: /opt/data/private/xzc/work2/backbone_functional_dynamics_stable
  environment: torch
  commit_or_diff: "Record git commit and dirty diff before the pilot."
intervention:
  axis: joint
  family: "Controlled feature excitation and graph propagation changes with a known cross-client functional correspondence; include shared, transferable-exclusive, and task-harmful actions."
  levels: [feature_only, structure_only, joint]
  invariants:
    - labels_and_splits
    - paired_receiver_initialization
    - probe_and_horizon_budgets
    - local_update_steps_and_norm
    - map_fit_and_defect_evaluation_split
mediator:
  name: heldout_intertwining_defect
  definition: "E_j_to_i_tau = P_i_tau(C_j_to_i Z_j) - C_j_to_i P_j_tau(Z_j); effective flow is its held-out decrease after receiver action-pair distillation."
controls:
  - ordinary_laplacian
  - matched_encoder_block
  - matched_classifier_block
  - matched_random_block
  - ground_truth_functional_map
  - descriptor_only_learned_map
  - wrong_functional_map
  - identity_no_map
  - source_time_shuffle
  - repeated_satisfied_constraint
  - task_harmful_constraint
  - old_canonical_prototype_pullback
  - orthogonal_mode_transfer_r010
  - matched_local_only_audit
evaluation:
  datasets:
    - controlled_known_map_action_system
    - Synthetic_feature_shift
    - Synthetic_structure_homophily
    - Synthetic_mixed
  seeds: [42]
  checkpoints: [frozen_pilot]
  fit_split: "Estimate Functional Maps from descriptor probes and network cycles only; do not use the held-out action probes or horizons that define transfer."
  test_split: "Evaluate map error, cycle error, action defect, distillation, and task behavior on held-out probes/horizons and paired receiver forks."
  metrics:
    - functional_map_relative_error
    - cycle_consistency_error
    - heldout_intertwining_defect
    - heldout_defect_reduction
    - receiver_task_change
    - task_constraint_gradient_cosine
    - satisfied_transferable_harmful_classification
    - source_time_shuffle_gap
    - communication_bytes
    - wall_time
decision_rule: "Advance only if the learned map generalizes to held-out descriptors/cycles, the defect separates satisfied from transferable-missing actions, action-pair distillation lowers both held-out defect and receiver task loss for transferable actions, harmful/repeated/wrong/shuffled controls do not create comparable effective flow, and cost is lower than R010 full-response processing."
failure_pattern: "Reject the mechanism if the map is unidentifiable without using the same dynamics being evaluated, if defect merely tracks arbitrary structural difference, if task-harmful actions pass the gate, if wrong or shuffled maps perform comparably, or if defect reduction does not improve the receiver task."
compute:
  workers: 1
  devices: "CPU for the known-map pilot; frozen GPU checkpoint audit only after the pilot passes."
  timeout_minutes: 30
outputs:
  run_tag: functional_intertwining_r011_seed42
  directory: "Use a new timestamped directory under backbone_functional_dynamics_stable/run_logs; never overwrite existing artifacts."
